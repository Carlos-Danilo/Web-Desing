<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mudança de Cor do Título</title>
</head>
<body>

    <h1 id="titulo">Título que muda de cor</h1>

    <script>  
        const cores = ["red", "blue", "green", "purple", "orange", "pink"];
        let indice = 0;

        function mudarCor() {
            const titulo = document.getElementById("titulo");
            titulo.style.color = cores[indice];

            indice++;
            if (indice >= cores.length) {
                indice = 0;
            }
        }

        setInterval(mudarCor, 30000);
    </script>

</body>
</html>
